<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Locator Inspector — Sidebar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1e1e1e;
      --surface:    #292a2d;
      --surface2:   #35363a;
      --border:     #3c4043;
      --border2:    #4a4d51;
      --text:       #e8eaed;
      --text2:      #9aa0a6;
      --text3:      #5f6368;
      --accent:     #8ab4f8;
      --green:      #81c995;
      --green-bg:   rgba(129,201,149,0.12);
      --yellow:     #fdd663;
      --yellow-bg:  rgba(253,214,99,0.12);
      --red:        #f28b82;
      --red-bg:     rgba(242,139,130,0.12);
      --pw-color:   #81c995;
      --pw-bg:      rgba(129,201,149,0.14);
      --css-color:  #8ab4f8;
      --css-bg:     rgba(138,180,248,0.14);
      --xpath-color:#ffb74d;
      --xpath-bg:   rgba(255,183,77,0.14);
      --smart-color:#cf8fff;
      --smart-bg:   rgba(207,143,255,0.14);
      --font-ui:    system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-code:  "SFMono-Regular", "Cascadia Mono", "Consolas", "Menlo", monospace;
    }

    .theme-light {
      --bg:         #ffffff;
      --surface:    #f8f9fa;
      --surface2:   #f1f3f4;
      --border:     #dadce0;
      --border2:    #bdc1c6;
      --text:       #202124;
      --text2:      #5f6368;
      --text3:      #9aa0a6;
      --accent:     #1a73e8;
      --green:      #34a853;
      --green-bg:   rgba(52,168,83,0.10);
      --yellow:     #f9ab00;
      --yellow-bg:  rgba(249,171,0,0.10);
      --red:        #ea4335;
      --red-bg:     rgba(234,67,53,0.10);
      --pw-color:   #1e8e3e;
      --pw-bg:      rgba(30,142,62,0.10);
      --css-color:  #1a73e8;
      --css-bg:     rgba(26,115,232,0.10);
      --xpath-color:#e37400;
      --xpath-bg:   rgba(227,116,0,0.10);
      --smart-color:#9334e9;
      --smart-bg:   rgba(147,52,233,0.10);
    }

    @media (prefers-color-scheme: light) {
      :root:not(.theme-dark):not(.theme-light) {
        --bg:         #ffffff;
        --surface:    #f8f9fa;
        --surface2:   #f1f3f4;
        --border:     #dadce0;
        --border2:    #bdc1c6;
        --text:       #202124;
        --text2:      #5f6368;
        --text3:      #9aa0a6;
        --accent:     #1a73e8;
        --green:      #34a853;
        --green-bg:   rgba(52,168,83,0.10);
        --yellow:     #f9ab00;
        --yellow-bg:  rgba(249,171,0,0.10);
        --red:        #ea4335;
        --red-bg:     rgba(234,67,53,0.10);
        --pw-color:   #1e8e3e;
        --pw-bg:      rgba(30,142,62,0.10);
        --css-color:  #1a73e8;
        --css-bg:     rgba(26,115,232,0.10);
        --xpath-color:#e37400;
        --xpath-bg:   rgba(227,116,0,0.10);
        --smart-color:#9334e9;
        --smart-bg:   rgba(147,52,233,0.10);
      }
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 11px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-width: 280px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px 4px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: background 0.1s, color 0.1s;
    }
    .theme-toggle:hover { background: var(--surface2); color: var(--text); }

    /* Element summary */
    .element-summary {
      padding: 7px 8px 6px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .element-tag {
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.5;
    }
    .el-tag-name { color: var(--accent); }
    .el-id       { color: var(--yellow); }
    .el-class    { color: var(--green); }

    .attr-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .attr-pill {
      font-family: var(--font-code);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 2px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attr-pill.testid { background: var(--pw-bg);  border-color: var(--pw-color);  color: var(--pw-color); }
    .attr-pill.role,
    .attr-pill.aria   { background: var(--css-bg); border-color: var(--css-color); color: var(--css-color); }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px 4px;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text2);
    }
    .section-count {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--font-code);
    }

    /* Best locator banner */
    .best-banner {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: var(--green-bg);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      color: var(--green);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .best-star { font-size: 10px; }

    /* Suggestion rows */
    .suggestions-list {
      display: flex;
      flex-direction: column;
    }
    .suggestion-row {
      position: relative;
      border-bottom: 1px solid var(--border);
      cursor: default;
      transition: background 0.08s;
    }
    .suggestion-row:last-child { border-bottom: none; }
    .suggestion-row:hover { background: var(--surface); }
    .suggestion-row.quality-high   { border-left: 2px solid var(--green); }
    .suggestion-row.quality-medium { border-left: 2px solid var(--yellow); }
    .suggestion-row.quality-low    { border-left: 2px solid var(--red); }
    .suggestion-row.is-best { background: var(--surface); }
    .suggestion-row.is-best:hover { background: var(--surface2); }

    .row-main {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 8px 4px 10px;
    }

    /* Type badge */
    .type-badge {
      font-family: var(--font-code);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 1px 4px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 1px;
      text-transform: uppercase;
    }
    .type-badge.pw    { background: var(--pw-bg);    color: var(--pw-color);    border: 1px solid var(--pw-color); }
    .type-badge.css   { background: var(--css-bg);   color: var(--css-color);   border: 1px solid var(--css-color); }
    .type-badge.xpath { background: var(--xpath-bg); color: var(--xpath-color); border: 1px solid var(--xpath-color); }
    .type-badge.smart { background: var(--smart-bg); color: var(--smart-color); border: 1px solid var(--smart-color); }

    /* Selector text */
    .selector-wrap { flex: 1; min-width: 0; }
    .selector-text {
      font-family: var(--font-code);
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.45;
      cursor: pointer;
      user-select: text;
    }
    .selector-text:hover { color: var(--accent); }

    /* Row meta */
    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 8px 6px 10px;
      gap: 6px;
    }
    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-pill {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-code);
      font-size: 10px;
    }
    .score-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .score-dot.green  { background: var(--green); }
    .score-dot.yellow { background: var(--yellow); }
    .score-dot.red    { background: var(--red); }
    .score-num-text { font-weight: 600; }
    .score-num-text.green  { color: var(--green); }
    .score-num-text.yellow { color: var(--yellow); }
    .score-num-text.red    { color: var(--red); }
    .score-denom { color: var(--text3); }
    .match-count {
      font-size: 10px;
      color: var(--text2);
      font-family: var(--font-code);
    }
    .match-count.unique { color: var(--green); }
    .match-count.multi  { color: var(--yellow); }
    .match-count.many   { color: var(--red); }

    /* Action buttons */
    .row-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .suggestion-row:hover .row-actions { opacity: 1; }
    .action-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text2);
      padding: 2px 5px;
      font-size: 11px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 2px;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }
    .action-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
    .action-btn.copied { color: var(--green); border-color: var(--green); background: var(--green-bg); }
    .action-btn.use-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(138,180,248,0.10); }

    /* Copy icon */
    .icon-copy {
      display: inline-block;
      width: 10px; height: 11px;
      position: relative; flex-shrink: 0;
    }
    .icon-copy::before {
      content: ''; position: absolute;
      top: 0; left: 2px; width: 7px; height: 8px;
      border: 1.5px solid currentColor; border-radius: 1px;
    }
    .icon-copy::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; width: 7px; height: 8px;
      border: 1.5px solid currentColor; border-radius: 1px;
      background: var(--bg);
    }
    .suggestion-row:hover .icon-copy::after { background: var(--surface); }
    .suggestion-row.is-best .icon-copy::after { background: var(--surface); }
    .suggestion-row.is-best:hover .icon-copy::after { background: var(--surface2); }

    /* Eye icon */
    .icon-eye {
      display: inline-block;
      width: 12px; height: 8px;
      position: relative; flex-shrink: 0;
    }
    .icon-eye::before {
      content: ''; position: absolute;
      top: 0; left: 0; width: 12px; height: 8px;
      border: 1.5px solid currentColor;
      clip-path: ellipse(6px 4px at 50% 50%);
    }
    .icon-eye::after {
      content: ''; position: absolute;
      top: 2px; left: 4px; width: 4px; height: 4px;
      border: 1.5px solid currentColor; border-radius: 50%;
    }

    /* States */
    .state-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 10px;
      text-align: center;
    }
    .state-icon  { font-size: 22px; line-height: 1; opacity: 0.5; }
    .state-title { font-size: 12px; font-weight: 600; color: var(--text2); }
    .state-body  { font-size: 11px; color: var(--text3); max-width: 220px; line-height: 1.55; }

    /* Spinner */
    .spinner-wrap {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 8px; font-size: 11px; color: var(--text2);
    }
    .spinner {
      width: 12px; height: 12px;
      border: 1.5px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Skeleton */
    .skeleton-row { padding: 7px 8px; border-bottom: 1px solid var(--border); }
    .skel {
      height: 10px; border-radius: 2px;
      background: linear-gradient(90deg, var(--surface2) 25%, var(--surface) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    .skel + .skel { margin-top: 5px; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Filter bar */
    .filter-bar {
      display: flex; align-items: center; gap: 3px;
      padding: 4px 8px; border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .filter-label { font-size: 10px; color: var(--text3); flex-shrink: 0; margin-right: 2px; }
    .filter-chip {
      font-size: 10px; font-family: var(--font-code);
      padding: 1px 6px; border-radius: 2px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text2); cursor: pointer;
      transition: background 0.08s, color 0.08s; user-select: none;
    }
    .filter-chip:hover { background: var(--surface); color: var(--text); }
    .filter-chip.active.pw    { background: var(--pw-bg);    color: var(--pw-color);    border-color: var(--pw-color); }
    .filter-chip.active.css   { background: var(--css-bg);   color: var(--css-color);   border-color: var(--css-color); }
    .filter-chip.active.xpath { background: var(--xpath-bg); color: var(--xpath-color); border-color: var(--xpath-color); }
    .filter-chip.active.smart { background: var(--smart-bg); color: var(--smart-color); border-color: var(--smart-color); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* Fade-in */
    .fade-in { animation: fadeIn 0.12s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Copy toast */
    .copy-toast {
      position: fixed; bottom: 10px; left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--green); font-size: 11px; font-family: var(--font-code);
      padding: 4px 10px; border-radius: 3px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 999; white-space: nowrap;
    }
    .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-title">Locator Inspector</span>
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark">
      <span id="themeIcon">☀</span>
    </button>
  </div>

  <div id="mainContent"></div>
  <div class="copy-toast" id="copyToast">Copied!</div>

<script src="sidebar.js"></script>

</body>
</html>
